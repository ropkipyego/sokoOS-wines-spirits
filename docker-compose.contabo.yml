name: sokoos-wines-spirits

services:
  postgres:
    image: postgres:16-alpine
    container_name: sokoos-wines-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sokoos_wines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sokoos_wines_spirits}
    ports:
      # Port 5435 on 127.0.0.1 only — never conflicts with AfyaSasa (:5433) or other DBs
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - sokoos_wines_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sokoos_wines} -d ${POSTGRES_DB:-sokoos_wines_spirits}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sokoos-wines-redis
    restart: unless-stopped
    ports:
      # Port 6381 on 127.0.0.1 only — never conflicts with AfyaSasa (:6380)
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - sokoos_wines_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sokoos-wines-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PRODUCT_EDITION: WINES_SPIRITS
      API_HOST: 0.0.0.0
      PORT: "3001"
      API_PORT: 3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://wines.yourdomain.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wines.yourdomain.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sokoos_wines}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sokoos_wines_spirits}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set strong JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set strong JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
    ports:
      # Bound to 127.0.0.1:3001 so Nginx/Caddy or Vercel can proxy to it without colliding with AfyaSasa (:3000)
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - sokoos_wines_uploads:/app/services/api/uploads

volumes:
  sokoos_wines_pg_data:
  sokoos_wines_redis_data:
  sokoos_wines_uploads:
